services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mf
      POSTGRES_USER: mf
      POSTGRES_PASSWORD: mf
    ports:
      - "5432:5432"
    volumes:
      - mf_pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mf:mf@db:5432/mf
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: "dev-secret-change-me"
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  mf_pg:
